name: Build Secure Gurukul Android App (APK & AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses Automatically
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Generate Native Android Project with 24x7 Push & Hardware Vibration
        run: |
          mkdir -p android-app/app/src/main/java/com/gurukul/dhankoli
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/assets

          if [ -f "index.html" ]; then
            cp index.html android-app/app/src/main/assets/index.html
          fi

          # 1. Valid Fallback PNG Icon
          python3 -c 'import base64; open("android-app/app/src/main/res/drawable/ic_launcher.png", "wb").write(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAbUlEQVRo3u3PQQ0AIAwEsfP3L7w4wRFFkHZ2d2Z1Gt5bAQICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgL+rQ5t4wN9745wMAAAAABJRU5ErkJggg=="))'

          # 2. Convert School Logo to True PNG
          curl -f -s -L "https://gsssdhankoli.github.io/Logo.png/logo.png" -o /tmp/raw_logo.img || true
          if [ -s /tmp/raw_logo.img ]; then
            ffmpeg -y -i /tmp/raw_logo.img -vf scale=192:192 -c:v png android-app/app/src/main/res/drawable/ic_launcher.png 2>/dev/null || true
          fi

          # Signing Key
          keytool -genkey -v -keystore android-app/app/gurukul-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias gurukul -storepass gurukul123 -keypass gurukul123 -dname "CN=Gurukul School Dhankoli, OU=Education, O=GSSS, L=Dhankoli, S=Rajasthan, C=IN"

          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "GurukulSchoolDhankoli"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > android-app/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.gurukul.dhankoli'
              compileSdk 34
              defaultConfig {
                  applicationId "com.gurukul.dhankoli"
                  minSdk 23
                  targetSdk 34
                  versionCode 6
                  versionName "6.0"
              }
              aaptOptions {
                  cruncherEnabled false
              }
              signingConfigs {
                  release {
                      storeFile file("gurukul-key.jks")
                      storePassword "gurukul123"
                      keyAlias "gurukul"
                      keyPassword "gurukul123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Gurukul School Dhankoli"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".GurukulPushService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 1. BootReceiver.java (फोन रीस्टार्ट होने पर भी नोटिफिकेशन सर्विस अपने-आप चालू करे)
          cat << 'EOF' > android-app/app/src/main/java/com/gurukul/dhankoli/BootReceiver.java
          package com.gurukul.dhankoli;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      context.startService(new Intent(context, GurukulPushService.class));
                  } catch (Exception ignored) {}
              }
          }
          EOF

          # 2. GurukulPushService.java (बंद ऐप में 24x7 नोटिफिकेशन + डायरेक्ट हार्डवेयर वाइब्रेशन इंजन)
          cat << 'EOF' > android-app/app/src/main/java/com/gurukul/dhankoli/GurukulPushService.java
          package com.gurukul.dhankoli;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.AudioAttributes;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.SystemClock;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import androidx.core.app.NotificationCompat;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.Set;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;
          import org.json.JSONObject;

          public class GurukulPushService extends Service {
              public static final String CHANNEL_ID = "GSSS_HIGH_VIBRATE_V3";
              private ScheduledExecutorService scheduler;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createHighPriorityChannel(this);
                  scheduler = Executors.newSingleThreadScheduledExecutor();
                  scheduler.scheduleWithFixedDelay(this::checkFirebaseNotifications, 2, 10, TimeUnit.SECONDS);
              }

              public static void createHighPriorityChannel(Context ctx) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      NotificationChannel ch = new NotificationChannel(
                          CHANNEL_ID,
                          "Gurukul School High Priority Alerts",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      ch.setDescription("Official School Alerts with Automatic Vibration & Sound");
                      ch.enableLights(true);
                      ch.enableVibration(true);
                      ch.setVibrationPattern(new long[]{0, 500, 200, 500, 200, 700});
                      ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      ch.setBypassDnd(true);

                      Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      AudioAttributes attrs = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();
                      ch.setSound(soundUri, attrs);
                      nm.createNotificationChannel(ch);
                  }
              }

              private void checkFirebaseNotifications() {
                  try {
                      SharedPreferences prefs = getSharedPreferences("GSSS_PREFS", MODE_PRIVATE);
                      String myStuId = prefs.getString("studentId", "ALL");
                      String myClass = prefs.getString("className", "ALL");
                      Set<String> seenSet = new HashSet<>(prefs.getStringSet("seenIds", new HashSet<>()));
                      boolean isFirstSync = !prefs.getBoolean("initialSyncDone", false);

                      URL url = new URL("https://gsss-dhankoli-erp-default-rtdb.firebaseio.com/notifications.json");
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(7000);
                      conn.setReadTimeout(7000);

                      if (conn.getResponseCode() != 200) return;

                      BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = reader.readLine()) != null) sb.append(line);
                      reader.close();

                      String jsonStr = sb.toString().trim();
                      if (jsonStr.isEmpty() || jsonStr.equals("null")) return;

                      JSONObject root = new JSONObject(jsonStr);
                      Iterator<String> keys = root.keys();
                      boolean changed = false;

                      while (keys.hasNext()) {
                          String key = keys.next();
                          if (seenSet.contains(key)) continue;

                          JSONObject n = root.optJSONObject(key);
                          seenSet.add(key);
                          changed = true;

                          if (isFirstSync || n == null) continue;

                          String tType = n.optString("targetType", "ALL");
                          String tVal = n.optString("targetValue", "ALL");
                          String title = n.optString("title", "Gurukul School Alert");
                          String msg = n.optString("message", "");

                          if (title.isEmpty() && msg.isEmpty()) continue;

                          boolean match = "ALL".equalsIgnoreCase(tType)
                              || ("CLASS".equalsIgnoreCase(tType) && tVal.equalsIgnoreCase(myClass))
                              || ("STUDENT".equalsIgnoreCase(tType) && tVal.equalsIgnoreCase(myStuId));

                          if (match) {
                              fireNativeHighAlert(this, "🔔 " + title, msg, key.hashCode());
                          }
                      }

                      if (changed || isFirstSync) {
                          prefs.edit()
                              .putStringSet("seenIds", seenSet)
                              .putBoolean("initialSyncDone", true)
                              .apply();
                      }
                  } catch (Exception ignored) {}
              }

              public static void fireNativeHighAlert(Context ctx, String title, String message, int notifId) {
                  try {
                      createHighPriorityChannel(ctx);

                      // 1. Direct Hardware Vibration (सेटिंग्स में गए बिना 100% वाइब्रेट करेगा)
                      Vibrator vib = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);
                      long[] pattern = new long[]{0, 500, 200, 500, 200, 700};
                      if (vib != null && vib.hasVibrator()) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vib.vibrate(VibrationEffect.createWaveform(pattern, -1));
                          } else {
                              vib.vibrate(pattern, -1);
                          }
                      }

                      // 2. Direct Notification Sound
                      try {
                          Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                          Ringtone r = RingtoneManager.getRingtone(ctx, soundUri);
                          if (r != null && !r.isPlaying()) r.play();
                      } catch (Exception ignored) {}

                      // 3. High-Priority Heads-Up Banner Notification
                      Intent intent = new Intent(ctx, MainActivity.class);
                      intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      PendingIntent pi = PendingIntent.getActivity(
                          ctx, notifId, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(ctx, CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle(title)
                          .setContentText(message)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(message))
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setDefaults(Notification.DEFAULT_ALL)
                          .setVibrate(pattern)
                          .setAutoCancel(true)
                          .setContentIntent(pi);

                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.notify(notifId, builder.build());
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              // जब छात्र ऐप को Recent Apps से हटा (Swipe) दे, तो 1.5 सेकंड में सर्विस दोबारा चालू हो जाए
              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  Intent restartIntent = new Intent(getApplicationContext(), GurukulPushService.class);
                  restartIntent.setPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getService(
                      getApplicationContext(), 1, restartIntent,
                      PendingIntent.FLAG_ONE_SHOT | PendingIntent.FLAG_IMMUTABLE
                  );
                  AlarmManager am = (AlarmManager) getApplicationContext().getSystemService(Context.ALARM_SERVICE);
                  if (am != null) {
                      am.set(AlarmManager.ELAPSED_REALTIME_WAKEUP, SystemClock.elapsedRealtime() + 1500, pi);
                  }
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 3. MainActivity.java
          cat << 'EOF' > android-app/app/src/main/java/com/gurukul/dhankoli/MainActivity.java
          package com.gurukul.dhankoli;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  // 1. High Priority Channel & Background Push Service तुरंत चालू करें
                  GurukulPushService.createHighPriorityChannel(this);
                  try {
                      startService(new Intent(this, GurukulPushService.class));
                  } catch (Exception ignored) {}

                  // 2. Android 13+ पर अपने-आप Notification Permission मांगें
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 202);
                      }
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setGeolocationEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setFlagSecure(final boolean restrict) {
                          runOnUiThread(() -> {
                              if (restrict) {
                                  getWindow().setFlags(
                                      WindowManager.LayoutParams.FLAG_SECURE,
                                      WindowManager.LayoutParams.FLAG_SECURE
                                  );
                              } else {
                                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                              }
                          });
                      }

                      @JavascriptInterface
                      public void saveStudentInfo(final String studentId, final String className) {
                          SharedPreferences prefs = getSharedPreferences("GSSS_PREFS", MODE_PRIVATE);
                          prefs.edit()
                              .putString("studentId", studentId != null ? studentId : "ALL")
                              .putString("className", className != null ? className : "ALL")
                              .apply();
                      }
                  }, "Android");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("tel:") || url.startsWith("https://wa.me/") || url.startsWith("mailto:")) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              return true;
                          }
                          return false;
                      }

                      @Override
                      public void onReceivedHttpError(WebView view, WebResourceRequest request, WebResourceResponse errorResponse) {
                          if (request.isForMainFrame() && errorResponse.getStatusCode() == 404) {
                              String failedUrl = request.getUrl().toString();
                              if (!failedUrl.contains("GURKUL-School-app")) {
                                  view.loadUrl("https://balvikasdhankoli341516-boop.github.io/GURKUL-School-app/");
                              } else {
                                  view.loadUrl("file:///android_asset/index.html");
                              }
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                      @Override
                      public boolean onShowFileChooser(WebView vw, ValueCallback<Uri[]> filePath, FileChooserParams params) {
                          filePathCallback = filePath;
                          Intent i = params.createIntent();
                          startActivityForResult(i, 101);
                          return true;
                      }
                  });

                  webView.loadUrl("https://balvikasdhankoli341516-boop.github.io/");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 101 && filePathCallback != null) {
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Signed Release APK & Play Store AAB
        working-directory: ./android-app
        run: |
          gradle assembleRelease bundleRelease

      - name: Upload Ready APK (For Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: Gurukul-Secure-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload Ready AAB (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Gurukul-PlayStore-AAB
          path: android-app/app/build/outputs/bundle/release/app-release.aab
