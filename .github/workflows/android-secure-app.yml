name: Build Secure Gurukul Android App (APK & AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses Automatically
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Generate Native Android Project with 24x7 Foreground Push Service
        run: |
          mkdir -p android-app/app/src/main/java/com/gurukul/dhankoli
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/assets

          if [ -f "index.html" ]; then
            cp index.html android-app/app/src/main/assets/index.html
          fi

          # 100% Original School / Diwali Logo Converter (Supports JPG, WebP, PNG)
          pip install --quiet pillow requests
          python3 - << 'PYEOF'
          import os, requests
          from PIL import Image
          from io import BytesIO

          out_path = "android-app/app/src/main/res/drawable/ic_launcher.png"
          img = None

          for local_candidate in ["logo.png", "Logo.png"]:
              if os.path.exists(local_candidate):
                  try:
                      img = Image.open(local_candidate)
                      break
                  except Exception:
                      pass

          if img is None:
              for url in [
                  "https://gsssdhankoli.github.io/Logo.png/logo.png",
                  "https://balvikasdhankoli341516-boop.github.io/logo.png"
              ]:
                  try:
                      r = requests.get(url, timeout=15)
                      if r.status_code == 200 and len(r.content) > 100:
                          img = Image.open(BytesIO(r.content))
                          break
                  except Exception:
                      pass

          if img is not None:
              img = img.convert("RGBA").resize((256, 256), Image.LANCZOS)
              img.save(out_path, format="PNG")
          else:
              fallback = Image.new("RGBA", (256, 256), (30, 58, 138, 255))
              fallback.save(out_path, format="PNG")
          PYEOF

          # Signing Key
          keytool -genkey -v -keystore android-app/app/gurukul-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias gurukul -storepass gurukul123 -keypass gurukul123 -dname "CN=Gurukul School Dhankoli, OU=Education, O=GSSS, L=Dhankoli, S=Rajasthan, C=IN"

          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "GurukulSchoolDhankoli"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > android-app/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.gurukul.dhankoli'
              compileSdk 34
              defaultConfig {
                  applicationId "com.gurukul.dhankoli"
                  minSdk 23
                  targetSdk 34
                  versionCode 8
                  versionName "8.0"
              }
              aaptOptions {
                  cruncherEnabled false
              }
              signingConfigs {
                  release {
                      storeFile file("gurukul-key.jks")
                      storePassword "gurukul123"
                      keyAlias "gurukul"
                      keyPassword "gurukul123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="Gurukul School Dhankoli"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".GurukulPushService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="com.gurukul.dhankoli.RESTART_PUSH_SERVICE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 1. BootReceiver.java (ऐप बंद होने या फोन रीस्टार्ट होने पर Foreground Service तुरंत चालू करे)
          cat << 'EOF' > android-app/app/src/main/java/com/gurukul/dhankoli/BootReceiver.java
          package com.gurukul.dhankoli;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      Intent srv = new Intent(context, GurukulPushService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(srv);
                      } else {
                          context.startService(srv);
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          # 2. GurukulPushService.java (24x7 Unkillable Foreground Service + Instant Popup Banner)
          cat << 'EOF' > android-app/app/src/main/java/com/gurukul/dhankoli/GurukulPushService.java
          package com.gurukul.dhankoli;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.AudioAttributes;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import androidx.core.app.NotificationCompat;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Iterator;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;
          import org.json.JSONObject;

          public class GurukulPushService extends Service {
              public static final String POPUP_CHANNEL_ID = "GSSS_WHATSAPP_POPUP_V8";
              public static final String BG_SYNC_CHANNEL_ID = "GSSS_SILENT_SYNC_V8";
              private ScheduledExecutorService scheduler;
              private PowerManager.WakeLock partialWakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannels(this);
                  startUnkillableForegroundMode();
                  acquireKeepAliveWakeLock();

                  scheduler = Executors.newSingleThreadScheduledExecutor();
                  scheduler.scheduleWithFixedDelay(this::checkFirebaseNotifications, 1, 4, TimeUnit.SECONDS);
              }

              private void acquireKeepAliveWakeLock() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && partialWakeLock == null) {
                          partialWakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "GurukulSchool::BgPushLock");
                          partialWakeLock.setReferenceCounted(false);
                          partialWakeLock.acquire();
                      }
                  } catch (Exception ignored) {}
              }

              private void startUnkillableForegroundMode() {
                  try {
                      Intent intent = new Intent(this, MainActivity.class);
                      PendingIntent pi = PendingIntent.getActivity(
                          this, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      Notification syncNotif = new NotificationCompat.Builder(this, BG_SYNC_CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle("Gurukul School Live Alerts Active")
                          .setContentText("Connected to School ERP Server 24×7")
                          .setPriority(NotificationCompat.PRIORITY_MIN)
                          .setOngoing(true)
                          .setSilent(true)
                          .setContentIntent(pi)
                          .build();

                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(999, syncNotif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                      } else {
                          startForeground(999, syncNotif);
                      }
                  } catch (Exception ignored) {}
              }

              public static void createChannels(Context ctx) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;

                      // 1. Silent Background Keep-Alive Channel
                      NotificationChannel syncCh = new NotificationChannel(
                          BG_SYNC_CHANNEL_ID,
                          "Gurukul Background Connection",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      syncCh.setDescription("Keeps school alerts active when app is closed");
                      syncCh.setSound(null, null);
                      syncCh.enableVibration(false);
                      syncCh.setShowBadge(false);
                      nm.createNotificationChannel(syncCh);

                      // 2. High-Priority WhatsApp-Style Popup Channel
                      NotificationChannel popCh = new NotificationChannel(
                          POPUP_CHANNEL_ID,
                          "Gurukul Instant Popup Alerts",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      popCh.setDescription("Instant School Popup Alerts with Vibration & Sound");
                      popCh.enableLights(true);
                      popCh.enableVibration(true);
                      popCh.setVibrationPattern(new long[]{0, 600, 200, 600, 200, 800});
                      popCh.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      popCh.setBypassDnd(true);

                      Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      AudioAttributes attrs = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();
                      popCh.setSound(soundUri, attrs);
                      nm.createNotificationChannel(popCh);
                  }
              }

              private void checkFirebaseNotifications() {
                  HttpURLConnection conn = null;
                  try {
                      SharedPreferences prefs = getSharedPreferences("GSSS_PREFS_V8", MODE_PRIVATE);
                      String myStuId = prefs.getString("studentId", "ALL");
                      String myClass = prefs.getString("className", "ALL");
                      boolean isAdmin = prefs.getBoolean("isAdmin", false);
                      boolean isFirstSync = !prefs.getBoolean("initialSyncDone", false);

                      // Cache-busting URL so Android never returns stale cached JSON in background
                      URL url = new URL("https://gsss-dhankoli-erp-default-rtdb.firebaseio.com/notifications.json?t=" + System.currentTimeMillis());
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("GET");
                      conn.setUseCaches(false);
                      conn.setRequestProperty("Cache-Control", "no-cache, no-store, must-revalidate");
                      conn.setRequestProperty("Pragma", "no-cache");
                      conn.setConnectTimeout(6000);
                      conn.setReadTimeout(6000);

                      if (conn.getResponseCode() != 200) return;

                      BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = reader.readLine()) != null) sb.append(line);
                      reader.close();

                      String jsonStr = sb.toString().trim();
                      if (jsonStr.isEmpty() || jsonStr.equals("null")) {
                          if (isFirstSync) {
                              prefs.edit().putBoolean("initialSyncDone", true).commit();
                          }
                          return;
                      }

                      JSONObject root = new JSONObject(jsonStr);
                      Iterator<String> keys = root.keys();
                      SharedPreferences.Editor editor = prefs.edit();
                      boolean anyUpdate = false;

                      while (keys.hasNext()) {
                          String key = keys.next();
                          String seenFlagKey = "SEEN_" + key;
                          if (prefs.getBoolean(seenFlagKey, false)) continue;

                          JSONObject n = root.optJSONObject(key);
                          editor.putBoolean(seenFlagKey, true);
                          anyUpdate = true;

                          if (isFirstSync || n == null) continue;

                          String tType = n.optString("targetType", "ALL");
                          String tVal = n.optString("targetValue", "ALL");
                          String title = n.optString("title", "Gurukul School Alert");
                          String msg = n.optString("message", "");

                          if (title.isEmpty() && msg.isEmpty()) continue;

                          boolean match = isAdmin
                              || "ALL".equalsIgnoreCase(myStuId)
                              || "ALL".equalsIgnoreCase(tType)
                              || ("CLASS".equalsIgnoreCase(tType) && ("ALL".equalsIgnoreCase(myClass) || tVal.equalsIgnoreCase(myClass)))
                              || ("STUDENT".equalsIgnoreCase(tType) && tVal.equalsIgnoreCase(myStuId));

                          if (match) {
                              fireNativeHighAlert(this, "🔔 " + title, msg, key);
                          }
                      }

                      if (isFirstSync || anyUpdate) {
                          editor.putBoolean("initialSyncDone", true);
                          editor.commit();
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              public static void fireNativeHighAlert(Context ctx, String title, String message, String uniqueKey) {
                  try {
                      SharedPreferences prefs = ctx.getSharedPreferences("GSSS_PREFS_V8", MODE_PRIVATE);
                      if (uniqueKey != null && !uniqueKey.isEmpty()) {
                          String firedKey = "FIRED_" + uniqueKey;
                          if (prefs.getBoolean(firedKey, false)) return;
                          prefs.edit()
                              .putBoolean(firedKey, true)
                              .putBoolean("SEEN_" + uniqueKey, true)
                              .commit();
                      }

                      createChannels(ctx);

                      // 1. Wake up screen immediately even if phone is locked
                      try {
                          PowerManager pm = (PowerManager) ctx.getSystemService(Context.POWER_SERVICE);
                          if (pm != null) {
                              PowerManager.WakeLock wl = pm.newWakeLock(
                                  PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP,
                                  "GurukulSchool:PopupWake"
                              );
                              wl.acquire(4500);
                          }
                      } catch (Exception ignored) {}

                      // 2. Direct Hardware Vibration
                      long[] pattern = new long[]{0, 600, 200, 600, 200, 800};
                      try {
                          Vibrator vib = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);
                          if (vib != null && vib.hasVibrator()) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  vib.vibrate(VibrationEffect.createWaveform(pattern, -1));
                              } else {
                                  vib.vibrate(pattern, -1);
                              }
                          }
                      } catch (Exception ignored) {}

                      // 3. Direct Notification Sound
                      try {
                          Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                          Ringtone r = RingtoneManager.getRingtone(ctx, soundUri);
                          if (r != null && !r.isPlaying()) r.play();
                      } catch (Exception ignored) {}

                      // 4. WhatsApp/Facebook Style Heads-Up Banner
                      int notifId = (uniqueKey != null) ? Math.abs(uniqueKey.hashCode()) : (int) (System.currentTimeMillis() & 0xfffffff);
                      Intent intent = new Intent(ctx, MainActivity.class);
                      intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      PendingIntent pi = PendingIntent.getActivity(
                          ctx, notifId, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      Bitmap largeLogo = BitmapFactory.decodeResource(ctx.getResources(), R.drawable.ic_launcher);

                      NotificationCompat.Builder builder = new NotificationCompat.Builder(ctx, POPUP_CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_popup_reminder)
                          .setLargeIcon(largeLogo)
                          .setContentTitle(title)
                          .setContentText(message)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(message))
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setDefaults(Notification.DEFAULT_ALL)
                          .setVibrate(pattern)
                          .setFullScreenIntent(pi, true)
                          .setAutoCancel(true)
                          .setContentIntent(pi);

                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.notify(notifId, builder.build());
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startUnkillableForegroundMode();
                  acquireKeepAliveWakeLock();
                  return START_STICKY;
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  try {
                      Intent restartBroadcast = new Intent(getApplicationContext(), BootReceiver.class);
                      restartBroadcast.setAction("com.gurukul.dhankoli.RESTART_PUSH_SERVICE");
                      sendBroadcast(restartBroadcast);

                      PendingIntent pi = PendingIntent.getBroadcast(
                          getApplicationContext(), 101, restartBroadcast,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      AlarmManager am = (AlarmManager) getApplicationContext().getSystemService(Context.ALARM_SERVICE);
                      if (am != null) {
                          am.set(AlarmManager.ELAPSED_REALTIME_WAKEUP, SystemClock.elapsedRealtime() + 1500, pi);
                      }
                  } catch (Exception ignored) {}
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 3. MainActivity.java (Keeps Background Service Alive + Requests 1-Tap Unrestricted Battery)
          cat << 'EOF' > android-app/app/src/main/java/com/gurukul/dhankoli/MainActivity.java
          package com.gurukul.dhankoli;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;

              @SuppressLint({"SetJavaScriptEnabled", "BatteryLife"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  // 1. Start 24x7 Foreground Push Service
                  GurukulPushService.createChannels(this);
                  try {
                      Intent srv = new Intent(this, GurukulPushService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(srv);
                      } else {
                          startService(srv);
                      }
                  } catch (Exception ignored) {}

                  // 2. Request Notification Permission (Android 13+)
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 202);
                      }
                  }

                  // 3. 1-Tap Battery Optimization Exemption (So phone NEVER freezes background internet)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                              Intent bIntent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              bIntent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(bIntent);
                          }
                      } catch (Exception ignored) {}
                  }

                  webView = new WebView(this) {
                      // Prevent Android from freezing WebView timers when minimized to Recent Apps
                      @Override
                      protected void onWindowVisibilityChanged(int visibility) {
                          super.onWindowVisibilityChanged(View.VISIBLE);
                      }
                  };
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setGeolocationEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setFlagSecure(final boolean restrict) {
                          runOnUiThread(() -> {
                              if (restrict) {
                                  getWindow().setFlags(
                                      WindowManager.LayoutParams.FLAG_SECURE,
                                      WindowManager.LayoutParams.FLAG_SECURE
                                  );
                              } else {
                                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                              }
                          });
                      }

                      @JavascriptInterface
                      public void syncUserSession(final String studentId, final String className, final boolean isAdmin) {
                          SharedPreferences prefs = getSharedPreferences("GSSS_PREFS_V8", MODE_PRIVATE);
                          prefs.edit()
                              .putString("studentId", (studentId != null && !studentId.isEmpty()) ? studentId : "ALL")
                              .putString("className", (className != null && !className.isEmpty()) ? className : "ALL")
                              .putBoolean("isAdmin", isAdmin)
                              .commit();
                      }

                      @JavascriptInterface
                      public void triggerPopupNotification(final String title, final String body, final String idTag) {
                          runOnUiThread(() -> {
                              GurukulPushService.fireNativeHighAlert(
                                  MainActivity.this,
                                  title != null ? title : "🔔 Gurukul Alert",
                                  body != null ? body : "",
                                  idTag
                              );
                          });
                      }
                  }, "Android");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("tel:") || url.startsWith("https://wa.me/") || url.startsWith("mailto:")) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              return true;
                          }
                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          String jsBridge =
                              "(function(){" +
                              "  if(window._gsssNativeHooked) return; window._gsssNativeHooked = true;" +
                              "  setInterval(function(){" +
                              "    try {" +
                              "      var sId = (typeof loggedInStudent !== 'undefined' && loggedInStudent && loggedInStudent.masterId) ? loggedInStudent.masterId : (localStorage.getItem('GSSS_SAVED_STUDENT_ID') || 'ALL');" +
                              "      var sCls = (typeof loggedInStudent !== 'undefined' && loggedInStudent && loggedInStudent.currentClass) ? loggedInStudent.currentClass : 'ALL';" +
                              "      var isAdm = localStorage.getItem('GSSS_ADMIN_LOGGED_IN') === 'true';" +
                              "      if(window.Android && window.Android.syncUserSession) window.Android.syncUserSession(sId, sCls, isAdm);" +
                              "    } catch(e){}" +
                              "  }, 2000);" +
                              "  window.fireAndroidStatusBarNotification = function(title, body, idTag){" +
                              "    try { if(window.Android && window.Android.triggerPopupNotification) window.Android.triggerPopupNotification(title, body, idTag || ''); } catch(e){}" +
                              "  };" +
                              "})();";
                          view.evaluateJavascript(jsBridge, null);
                      }

                      @Override
                      public void onReceivedHttpError(WebView view, WebResourceRequest request, WebResourceResponse errorResponse) {
                          if (request.isForMainFrame() && errorResponse.getStatusCode() == 404) {
                              String failedUrl = request.getUrl().toString();
                              if (!failedUrl.contains("GURKUL-School-app")) {
                                  view.loadUrl("https://balvikasdhankoli341516-boop.github.io/GURKUL-School-app/");
                              } else {
                                  view.loadUrl("file:///android_asset/index.html");
                              }
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                      @Override
                      public boolean onShowFileChooser(WebView vw, ValueCallback<Uri[]> filePath, FileChooserParams params) {
                          filePathCallback = filePath;
                          Intent i = params.createIntent();
                          startActivityForResult(i, 101);
                          return true;
                      }
                  });

                  webView.loadUrl("https://balvikasdhankoli341516-boop.github.io/");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 101 && filePathCallback != null) {
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
