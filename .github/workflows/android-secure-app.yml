name: Build Secure Gurukul Android App (APK & AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses Automatically
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Generate Native Android Project with FLAG_SECURE & Admin Bridge
        run: |
          mkdir -p android-app/app/src/main/java/com/gurukul/dhankoli
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/assets

          if [ -f "index.html" ]; then
            cp index.html android-app/app/src/main/assets/index.html
          fi

          # 1. Pehle ek 100% Valid Fallback PNG Icon banayein (Taaki build kabhi fail na ho)
          python3 -c 'import base64; open("android-app/app/src/main/res/drawable/ic_launcher.png", "wb").write(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAbUlEQVRo3u3PQQ0AIAwEsfP3L7w4wRFFkHZ2d2Z1Gt5bAQICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgL+rQ5t4wN9745wMAAAAABJRU5ErkJggg=="))'

          # 2. Agar logo.png (JPG/WebP/PNG) mile to ffmpeg se asli PNG me convert karein
          curl -f -s -L "https://gsssdhankoli.github.io/Logo.png/logo.png" -o /tmp/raw_logo.img || true
          if [ -s /tmp/raw_logo.img ]; then
            ffmpeg -y -i /tmp/raw_logo.img -vf scale=192:192 -c:v png android-app/app/src/main/res/drawable/ic_launcher.png 2>/dev/null || true
          fi

          # Auto-Generate Official Signing Key
          keytool -genkey -v -keystore android-app/app/gurukul-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias gurukul -storepass gurukul123 -keypass gurukul123 -dname "CN=Gurukul School Dhankoli, OU=Education, O=GSSS, L=Dhankoli, S=Rajasthan, C=IN"

          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "GurukulSchoolDhankoli"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > android-app/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.gurukul.dhankoli'
              compileSdk 34
              defaultConfig {
                  applicationId "com.gurukul.dhankoli"
                  minSdk 23
                  targetSdk 34
                  versionCode 5
                  versionName "5.0"
              }
              aaptOptions {
                  cruncherEnabled false
              }
              signingConfigs {
                  release {
                      storeFile file("gurukul-key.jks")
                      storePassword "gurukul123"
                      keyAlias "gurukul"
                      keyPassword "gurukul123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Gurukul School Dhankoli"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/gurukul/dhankoli/MainActivity.java
          package com.gurukul.dhankoli;

          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setGeolocationEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setFlagSecure(final boolean restrict) {
                          runOnUiThread(() -> {
                              if (restrict) {
                                  getWindow().setFlags(
                                      WindowManager.LayoutParams.FLAG_SECURE,
                                      WindowManager.LayoutParams.FLAG_SECURE
                                  );
                              } else {
                                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                              }
                          });
                      }
                  }, "Android");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("tel:") || url.startsWith("https://wa.me/") || url.startsWith("mailto:")) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              return true;
                          }
                          return false;
                      }

                      @Override
                      public void onReceivedHttpError(WebView view, WebResourceRequest request, WebResourceResponse errorResponse) {
                          if (request.isForMainFrame() && errorResponse.getStatusCode() == 404) {
                              String failedUrl = request.getUrl().toString();
                              if (!failedUrl.contains("GURKUL-School-app")) {
                                  view.loadUrl("https://balvikasdhankoli341516-boop.github.io/GURKUL-School-app/");
                              } else {
                                  view.loadUrl("file:///android_asset/index.html");
                              }
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                      @Override
                      public boolean onShowFileChooser(WebView vw, ValueCallback<Uri[]> filePath, FileChooserParams params) {
                          filePathCallback = filePath;
                          Intent i = params.createIntent();
                          startActivityForResult(i, 101);
                          return true;
                      }
                  });

                  webView.loadUrl("https://balvikasdhankoli341516-boop.github.io/");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 101 && filePathCallback != null) {
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Signed Release APK & Play Store AAB
        working-directory: ./android-app
        run: |
          gradle assembleRelease bundleRelease

      - name: Upload Ready APK (For Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: Gurukul-Secure-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload Ready AAB (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Gurukul-PlayStore-AAB
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          
